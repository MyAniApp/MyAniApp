include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/**.graphql.dart
    - lib/**.gr.dart
    - packages/flutter_markdown_plus/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  custom_lint: 0.8.1
  riverpod_lint: 3.1.9

linter:
  rules:
    - use_string_buffers