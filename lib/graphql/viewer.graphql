# import '/graphql/fragments/user.graphql'

fragment ThisUser on User {
  ...UserFragment
  id
  name
  about
  bannerImage
  unreadNotificationCount
  avatar {
    large
  }
  statistics {
    anime {
      count
      episodesWatched
      minutesWatched
      meanScore
      standardDeviation
    }
    manga {
      count
      chaptersRead
      volumesRead
      meanScore
      standardDeviation
    }
  }
  options {
    displayAdultContent
    includeAdultContentInSearch
    includeAdultContentInQuickSearch
    displayAdultActivities
    airingNotifications
    titleLanguage
    staffNameLanguage
    activityMergeTime
    restrictMessagesToFollowing
  }
  mediaListOptions {
    scoreFormat
    rowOrder
    animeList {
      customLists
      sectionOrder
      splitCompletedSectionByFormat
      advancedScoring
      advancedScoringEnabled
    }
    mangaList {
      customLists
      sectionOrder
      splitCompletedSectionByFormat
      advancedScoring
      advancedScoringEnabled
    }
  }
}

query Viewer {
  Viewer {
    ...ThisUser
  }
}

query NotificationCount {
  Viewer {
    unreadNotificationCount
    options {
      airingNotifications
    }
  }
}

mutation UpdateUser(
  $about: String
  $titleLanguage: UserTitleLanguage
  $displayAdultContent: Boolean
  $includeAdultContentInSearch: Boolean
  $includeAdultContentInQuickSearch: Boolean
  $displayAdultActivities: Boolean
  $airingNotifications: Boolean
  $scoreFormat: ScoreFormat
  $rowOrder: String
  $profileColor: String
  $donatorBadge: String
  $notificationOptions: [NotificationOptionInput]
  $timezone: String
  $activityMergeTime: Int
  $animeListOptions: MediaListOptionsInput
  $mangaListOptions: MediaListOptionsInput
  $staffNameLanguage: UserStaffNameLanguage
  $restrictMessagesToFollowing: Boolean
  $disabledListActivity: [ListActivityOptionInput]
) {
  UpdateUser(
    about: $about
    titleLanguage: $titleLanguage
    displayAdultContent: $displayAdultContent
    includeAdultContentInSearch: $includeAdultContentInSearch
    includeAdultContentInQuickSearch: $includeAdultContentInQuickSearch
    displayAdultActivities: $displayAdultActivities
    airingNotifications: $airingNotifications
    scoreFormat: $scoreFormat
    rowOrder: $rowOrder
    profileColor: $profileColor
    donatorBadge: $donatorBadge
    notificationOptions: $notificationOptions
    timezone: $timezone
    activityMergeTime: $activityMergeTime
    animeListOptions: $animeListOptions
    mangaListOptions: $mangaListOptions
    staffNameLanguage: $staffNameLanguage
    restrictMessagesToFollowing: $restrictMessagesToFollowing
    disabledListActivity: $disabledListActivity
  ) {
    ...ThisUser
  }
}
